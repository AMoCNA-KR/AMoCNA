services:
  palamedes:
    build:
      context: ../../..
      dockerfile: modules/palamedes/deployment/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPO=amocna
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      rabbitmq:
        condition: service_healthy
      graphdb:
        condition: service_started
      graphdb-provisioner:
        condition: service_completed_successfully

  rabbitmq:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphdb:
    image: ontotext/graphdb:11.3.3
    ports:
      - "7200:7200"
    environment:
      - GDB_HEAP_SIZE=1G
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ../../../graphdb.license:/opt/graphdb/home/conf/graphdb.license

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  graphdb-provisioner:
    image: alpine:latest
    container_name: graphdb-provisioner
    volumes:
      - ./provision-graphdb.sh:/provision-graphdb.sh
      - ./amocna-repo-config.ttl:/config/amocna-repo-config.ttl
      - ./restart-action-blueprint.ttl:/config/restart-action-blueprint.ttl
      - ../../../ontology:/ontology
    environment:
      - GRAPHDB_URL=http://graphdb:7200
      - REPOSITORY_ID=amocna
    depends_on:
      - graphdb
    entrypoint:
      ["/bin/sh", "-c", "apk add --no-cache curl && /provision-graphdb.sh"]

volumes:
  graphdb-data:
