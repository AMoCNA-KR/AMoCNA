apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-stress
  namespace: default
spec:
  replicas: 0 # Start with 0, manually scale up to trigger scenarios
  selector:
    matchLabels:
      app: cluster-stress
  template:
    metadata:
      labels:
        app: cluster-stress
    spec:
      containers:
        - name: stress
          image: progrium/stress
          args:
            - "--cpu"
            - "1"
            - "--io"
            - "1"
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "256M"
            - "--timeout"
            - "600s"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
