apiVersion: apps/v1
kind: Deployment
metadata:
  name: hephaestus
  namespace: hephaestus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hephaestus
  template:
    metadata:
      labels:
        app: hephaestus
    spec:
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-rabbitmq
          image: curlimages/curl:8.12.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              URL="http://rabbitmq.rabbitmq.svc.cluster.local:15672/"
              echo "Waiting for RabbitMQ management at $URL ..."
              until curl -sf "$URL" > /dev/null; do
                sleep 2
              done
              echo "RabbitMQ is reachable."
      containers:
        - name: hephaestus
          image: ghcr.io/amocna-kr/hephaestus:1.6.4-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: METRICS_ADAPTER_URL
              value: "http://metrics-adapter.metrics-adapter.svc.cluster.local:8080"
            - name: GRAPHDB_URL
              value: "http://graphdb.graphdb.svc.cluster.local:7200"
            - name: PROMETHEUS_URL
              value: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
