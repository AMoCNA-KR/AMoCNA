apiVersion: v1
kind: ServiceAccount
metadata:
  name: metis
  namespace: hephaestus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metis-sensor
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metis-sensor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metis-sensor
subjects:
  - kind: ServiceAccount
    name: metis
    namespace: hephaestus
