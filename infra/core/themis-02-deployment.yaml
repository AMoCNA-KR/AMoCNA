apiVersion: apps/v1
kind: Deployment
metadata:
  name: themis
  namespace: themis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: themis
  template:
    metadata:
      labels:
        app: themis
    spec:
      imagePullSecrets:
        - name: ghcr-login
      initContainers:
        - name: wait-for-rabbitmq
          image: curlimages/curl:8.12.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              URL="http://rabbitmq.rabbitmq.svc.cluster.local:15672/"
              echo "Waiting for RabbitMQ management at $URL ..."
              until curl -sf "$URL" > /dev/null; do
                sleep 2
              done
              echo "RabbitMQ is reachable."
      containers:
        - name: themis
          image: ghcr.io/amocna-kr/themis:1.6.2-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: SPRING_RABBITMQ_HOST
              value: "rabbitmq.rabbitmq.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
