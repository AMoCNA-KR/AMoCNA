apiVersion: apps/v1
kind: Deployment
metadata:
  name: metis
  namespace: metis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metis
  template:
    metadata:
      labels:
        app: metis
    spec:
      serviceAccountName: metis
      containers:
        - name: metis
          image: sglomski/metis:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50052
              name: grpc
          env:
            - name: METIS_GRAPHDB_URL
              value: "http://graphdb.graphdb.svc.cluster.local:7200"
            - name: METIS_GRAPHDB_REPOSITORYID
              value: "amocna"
            - name: METIS_PALAMEDES_HOST
              value: "localhost"   # no Palamedes yet — notifier will log errors but not crash
            - name: METIS_PALAMEDES_PORT
              value: "50051"
            - name: METIS_SENSOR_ENABLED
              value: "true"
            - name: METIS_SENSOR_NAMESPACES
              value: "hephaestus-business"
