spring:
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  main:
    web-application-type: none

grpc:
  server:
    port: 50052

metis:
  graphdb:
    url: "http://graphdb:7200"
    repositoryId: "amocna"
    timeoutMs: 5000
  ontology:
    cneeNamespace: "http://www.semanticweb.org/szymo/ontologies/2026/2/CNEEOnt#"
  palamedes:
    host: "palamedes"
    port: 50051
  sensor:
    enabled: true
    namespaces: []          # empty = watch all namespaces; e.g. [default, production]
    batch-size: 50
    flush-interval-ms: 500
